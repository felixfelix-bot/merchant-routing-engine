# Provider definitions for the merchant routing engine
# API keys are NEVER stored here — they come from environment variables.

# ── z.ai (primary, flat-rate subscription) ──────────────────────────────────
zai:
  upstream: "https://api.z.ai/api/coding/paas/v4"
  keys:
    ours:
      key_env: "ZAI_OUR_KEY"
      monthly_fee_usd: 155
      entitlement_tokens_mo: 18450000000  # §0.5 provisional (provisional until measured)
      # Cost formula (v2.1 §0.5): 155 / entitlement_tokens_mo * 1e6 = $/M baseline.
      # Effective price = baseline × pressure(u_5h, u_week, u_month) × peak_mult.
      # Decreases as the month progresses only in the realized (usage-amortized)
      # view; the gate uses the entitlement baseline.
      quota_api: "https://api.z.ai/api/coding/paas/v4/quota"
      quota_windows: [5h, weekly, monthly]
    friend:
      key_env: "ZAI_API_KEY"
      # CG-2 §0.5 v2.1: z.ai is NOT free. friend = $80/mo friend subscription.
      # Pre-v2.1 this was 0 (free-tier artifact) which silently floored at
      # $0.001/M — fixed 2026-08-22. Baseline = 80 / entitlement_tokens_mo.
      monthly_fee_usd: 80
      entitlement_tokens_mo: 18450000000  # §0.5 provisional estimate (~18.45B)
      penalty_pct: 21     # 21% premium vs our key (ADR-005)
      quota_api: "https://api.z.ai/api/coding/paas/v4/quota"
      quota_windows: [5h, weekly, monthly]

  # Peak hours: UTC 06:00–09:59 (Beijing 14:00–17:59)
  # Price triples during peak (deterministic step, ADR-003)
  peak_hours_utc: [6, 10]  # [start, end] inclusive
  peak_multiplier: 3.0

# ── Ollama Cloud (secondary, flat-rate with rate limits) ────────────────────
ollama_cloud:
  base_url: "https://ollama.com/v1"
  key_env: "OLLAMA_CLOUD_API_KEY"
  monthly_fee_usd: 25   # grandfathered flat ~$25/mo (Aug-7 analysis; was stale 100, fixed 2026-09-02)
  # Cost formula: 25 / tokens_consumed_this_month * 1e6 = $/M
  # NOTE: we hold TWO ollama subs (ollama_cloud + ollama_cloud_2) — any future
  # per-sub migration price doubles.
  # When rate-limited (429): effective_price = infinity (health_factor)
  # Quota: 5h session window + 7d weekly window (consultant-verified)
  usage_api: "https://ollama.com/api/usage"
  session_window_hours: 5
  weekly_window_hours: 168
  quota_windows: [5h, weekly]
  included_quota_tokens_session: 500000000   # 500M tokens per 5h session
  included_quota_tokens_weekly: 3500000000   # 3.5B tokens per 7-day week
  extra_usage_rate_per_m: 0.15               # LEGACY: real_price_tracker is source of truth (RP-4). Value kept for reference only.
                                              # Tracker resolves via get_rate_with_fallback('ollama_cloud_extra').

# ── External per-token providers (last resort) ─────────────────────────────
# RP-4: cost_per_1m fields below are LEGACY reference values. Real rates are
# sourced from real_price_tracker.get_rate_with_fallback() at runtime.
# Values kept for documentation only — the tracker is the source of truth.
external:
  ppq:
    base_url: "https://api.ppq.ai/v1"
    key_env: "PPQ_API_KEY"
    pricing_model: per_token
    # Fixed price — no Kalman needed (constant)
    models:
      deepseek-v4-flash:
        cost_per_1m_input: 0.09    # LEGACY: tracker is source of truth (RP-4)
        cost_per_1m_output: 0.19   # LEGACY: tracker is source of truth (RP-4)

  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    key_env: "OPENROUTER_API_KEY"
    headers:
      HTTP-Referer: "https://hermes.local"
      X-Title: "Hermes Agent"
    pricing_model: per_token
    models:
      deepseek-v4-flash:
        cost_per_1m_input: 0.09    # LEGACY: tracker is source of truth (RP-4)
        cost_per_1m_output: 0.18   # LEGACY: tracker is source of truth (RP-4)

  deepinfra:
    base_url: "https://api.deepinfra.com/v1/openai"
    key_env: "DEEPINFRA_API_KEY"
    pricing_model: per_token
    models:
      deepseek-v4-flash:
        cost_per_1m_input: 0.09    # LEGACY: tracker is source of truth (RP-4)
        cost_per_1m_output: 0.19   # LEGACY: tracker is source of truth (RP-4)

  telnyx:
    base_url: "https://api.telnyx.com/v2/ai/openai"
    key_env: "TELNYX_API_KEY"
    pricing_model: per_token
    # Telnyx AI inference — OpenAI-compatible API
    # Direct endpoint: https://api.telnyx.com/v2/ai/chat/completions
    # Auth: Bearer token (KEY0... prefix, not OpenAI format)
    # Balance: https://api.telnyx.com/v2/balance (data.balance, data.available_credit)
    # Prompt caching: usage.prompt_tokens_details.cached_tokens
    # Reasoning models (e.g. Kimi K3) report usage.reasoning_tokens
    models:
      moonshotai/Kimi-K3:
        cost_per_1m_input: 0.60    # LEGACY: tracker is source of truth (RP-4)
        cost_per_1m_output: 2.50   # LEGACY: tracker is source of truth (RP-4)
      moonshotai/Kimi-K2.6:
        cost_per_1m_input: 0.60
        cost_per_1m_output: 2.50
      zai-org/GLM-5.2:
        cost_per_1m_input: 0.20
        cost_per_1m_output: 0.80
      openai/gpt-5:
        cost_per_1m_input: 2.50
        cost_per_1m_output: 10.00
      anthropic/claude-haiku-4-5:
        cost_per_1m_input: 0.80
        cost_per_1m_output: 4.00
      google/gemini-2.5-flash:
        cost_per_1m_input: 0.15
        cost_per_1m_output: 0.60

# ── oxalpha (PROMO tier — stealth/ox-alpha free promo on OpenRouter) ────────
# ADDITIVE entry (OX-1, docs/PLAN-oxalpha-promo-2026-08-21.md §2.1, Felix
# approved 2026-08-21 D1–D6). Nothing above this block changes. Delete this
# block + restart proxy to fully remove the tier (plan §6). Guard logic lives
# in src/promo_tier.py (pure, tested). OX-2 STATUS (2026-09-01): the proxy
# failover wiring was removed (promo key 401-dead upstream; routing hook was
# unreachable with the flat router primary — see the 2026-09-01 dead-code
# sweep). The OX-1 guard + eval fixtures remain live and contract-tested.
oxalpha:
  base_url: "https://openrouter.ai/api/v1"
  key_env: "OPENROUTER_OXALPHA_KEY"     # NEW $0-spend-limit key (plan §2.4/D6); main OPENROUTER_API_KEY stays dormant
  headers: { HTTP-Referer: "https://hermes.local", X-Title: "Hermes Agent" }
  pricing_model: promo_zero
  promo:
    expires_at: "2026-08-28T00:00:00Z"  # conservative hard deadline (D3; community: Aug 26–28 fuzzy)
    post_promo_pessimistic_per_m: { input: 10.0, output: 30.0 }  # safety flip — priced OUT, not a market estimate
    verified_rate: { input: 0.0, output: 0.0 }   # observed 2026-08-21 (plan §0.3 probe)
  budget_usd: 0                          # ANY nonzero charge → tier disable + anomaly_events row (plan §2.4)
  data_sensitivity: allowlist            # plan §2.5
  allowlist_task_types: [vision, bulk_summarize, shadow_eval]
  rate_limit_backoff_s: [60, 120, 300]   # 429 backoff, then circuit breaker 5 fails / 300 s (plan §2.6)

  # ── OX-2 proxy wiring — REMOVED (2026-09-01 dead-code sweep) ─────────────
  # The `failover:` sub-block is dead config: the promo key 401s upstream
  # and the only routing hook lived on the old-path failover, unreachable
  # with the flat router primary. src/oxalpha_tier.py (pure, contract-tested)
  # defaults failover.enabled=True when the block is absent — revive by
  # re-adding it if a new promo key is ever issued.

  # Acceleration plan §4 (armed, NOT live until the OX-3b rung-1 flip):
  preferred_for:
    enabled: false          # OX-3b flips true + names rung-1 digester lanes
    models: [glm-4.5-flash] # §5.2: glm-5.2/glm-5.3 are hard-excluded in CODE — never list them here
    task_types: [bulk_summarize]
    effort: low
    max_completion_tokens: 8192
    upstream_timeout_s: 90
  # kill-switch (§4.2): touch ~/.hermes/bot/.oxalpha_alias_off to disable the
  # ALIAS only; failover/opt-in unaffected. Delete this whole block +
  # restart to remove the tier completely (plan §6).

# ── Strategy configuration ─────────────────────────────────────────────────
strategy:
  # Minimum effective price — never zero, even for free providers (ADR-004)
  min_effective_price: 0.001  # $/M

  # Quality thresholds — models below these tiers are filtered out
  quality_tiers:
    high: ["glm-5.2", "glm-4.5"]
    standard: ["glm-4.5-air"]
    low: ["glm-4.5-flash"]

  # Default difficulty → tier mapping
  difficulty_mapping:
    high: high
    medium: standard
    low: low

  # Fallback model when all z.ai keys exhausted
  fallback_model: "deepseek/deepseek-v4-flash"

  # ── Model mapping: (provider, task_type) → model_name ────────────────────
  # provider is the *service* name: zai (covers ours/friend/manager/worker),
  # ollama_cloud, ppq, openrouter, deepinfra.
  # task_type ∈ {coding, reasoning, chat, simple}.
  # src/model_mapping.py reads this; falls back to hardcoded MODEL_MAP when
  # a cell is missing.
  model_map:
    zai:
      coding: "glm-5.2"
      reasoning: "glm-5.3"  # premium — z.ai exclusive (substitutes to glm-5.2 on Ollama)
      chat: "glm-4.5-air"
      simple: "glm-4.5-flash"
    deepinfra:
      coding: "deepseek-v4-pro"
      reasoning: "deepseek-v4-pro"
      chat: "deepseek-v4-flash"
      simple: "deepseek-v4-flash"
    ppq:
      coding: "kimi-k3"
      reasoning: "kimi-k3"
      chat: "deepseek-v4-flash"
      simple: "deepseek-v4-flash"
    openrouter:
      coding: "deepseek-v4-pro"
      reasoning: "deepseek-v4-pro"
      chat: "deepseek-v4-flash"
      simple: "deepseek-v4-flash"
    ollama_cloud:
      coding: "glm-5.2"
      reasoning: "glm-5.2"
      chat: "glm-4.5-flash"
      simple: "glm-4.5-flash"
    telnyx:
      coding: "kimi-k3"
      reasoning: "kimi-k3"
      chat: "kimi-k2.5"
      simple: "kimi-k2.5"
    # OX-2 (2026-08-22, additive): opt-in task-type cells ONLY (D2 allowlist:
    # vision/bulk_summarize/shadow_eval). The generic failover insertion does
    # NOT read these cells — it always targets stealth/ox-alpha via
    # src/oxalpha_tier.py. No coding/reasoning/chat/simple cells exist for
    # oxalpha by design.
    oxalpha:
      vision: "stealth/ox-alpha"
      bulk_summarize: "stealth/ox-alpha"

  # Circuit breaker: trip after N consecutive failures
  circuit_breaker_threshold: 5
  circuit_breaker_cooldown_seconds: 300

  # Exhausted key cooldown
  exhausted_retry_seconds: 300
  unfunded_retry_seconds: 3600

# ── Shadow mode configuration (Phase 1) ────────────────────────────────────
shadow_mode:
  enabled: false  # set true when shadow logger is wired
  db_path: "~/.hermes/bot/zai_usage.db"
  log_table: "routing_shadow_decisions"
  # Log both live (best_key) and shadow (routing_optimizer) decisions
  # Compare after 48h to validate the price-first engine
