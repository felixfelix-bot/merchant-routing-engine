<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merchant Routing Engine — Live Pricing Demo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <script src="vendor/plotly-2.35.2.min.js"></script>
  <script src="vendor/nostr-tools.min.js"></script>
  <style>
    :root{
      --bg:#0d1117;--card:#161b22;--border:#30363d;
      --txt:#c9d1d9;--txt-bright:#f0f6fc;--txt-dim:#8b949e;
      --mono:'SF Mono','Cascadia Code','Fira Code',monospace;
      --blue:#58a6ff;--purple:#bc8cff;--cyan:#39d2c0;
      --orange:#f0883e;--red:#f85149;--green:#3fb950;--yellow:#d29922;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;min-height:100vh;overflow-x:hidden}
    
    /* HEADER */
    .header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border)}
    .header-title{font-size:15px;font-weight:700;color:var(--txt-bright);letter-spacing:.5px}
    .header-right{display:flex;align-items:center;gap:12px}
    .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:.5px}
    .badge.live{background:rgba(63,185,80,.15);color:var(--green)}
    .badge.connecting{background:rgba(210,153,34,.15);color:var(--yellow)}
    .badge.stale{background:rgba(210,153,34,.15);color:var(--yellow)}
    .badge.error{background:rgba(248,81,73,.15);color:var(--red)}
    .clock{font-size:12px;color:var(--txt-dim);font-family:var(--mono)}
    
    /* MAIN ARCHITECTURE LAYOUT */
    .arch-container{position:relative;padding:24px;max-width:1600px;margin:0 auto}
    
    /* Provider row */
    .provider-row{display:flex;gap:16px;margin-bottom:0;position:relative;z-index:2}
    .provider-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;min-width:0}
    .provider-card .card-header{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .provider-name{font-size:12px;font-weight:700;letter-spacing:1px}
    .provider-rate{font-size:11px;font-family:var(--mono);color:var(--txt-dim)}
    .provider-chart{height:200px;position:relative}
    .provider-status{padding:4px 12px;border-top:1px solid var(--border);font-size:10px;color:var(--txt-dim);display:flex;justify-content:space-between}
    
    /* Consumer card */
    .consumer-card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:24px}
    .consumer-card .card-header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .consumer-chart{height:280px}
    
    /* SVG edges overlay */
    .edges-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
    .edge-line{stroke:#30363d;stroke-width:1.5;opacity:.5;transition:all .5s ease}
    .edge-line.active{stroke-width:3;opacity:.9}
    .edge-dot{r:3;animation:flowDot 2s linear infinite}
    @keyframes flowDot{0%{offset-distance:0%}100%{offset-distance:100%}}
    
    /* Status dot */
    .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
    .status-dot.alive{background:var(--green);box-shadow:0 0 6px var(--green)}
    .status-dot.dead{background:var(--red);opacity:.5}
    
    /* Edge spacer */
    .edge-spacer{height:80px;position:relative;z-index:1}
  </style>
</head>
<body>

<div class="header">
  <div class="header-title">⚡ Merchant Routing Engine — Live Pricing</div>
  <div class="header-right">
    <span class="badge connecting" id="conn-badge"><span id="conn-text">connecting…</span></span>
    <span class="clock" id="time-text">--:--:--</span>
  </div>
</div>

<div class="arch-container" id="arch-container">
  <!-- SVG edges layer -->
  <svg class="edges-svg" id="edges-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  
  <!-- Provider row -->
  <div class="provider-row" id="provider-row"></div>
  
  <!-- Edge spacer for visual gap -->
  <div class="edge-spacer"></div>
  
  <!-- Consumer -->
  <div class="consumer-card">
    <div class="card-header">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:16px">🧑</span>
        <span class="provider-name" style="font-size:14px">CONSUMER — Price / M over time</span>
      </div>
      <span class="provider-rate" id="consumer-rate">—</span>
    </div>
    <div class="consumer-chart" id="consumer-chart"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   CONFIG
   ════════════════════════════════════════════════════════════════════════ */
function param(name){return new URLSearchParams(location.search).get(name);}

const CVM_NPUB_HEX = param('npub') || '10814a5dc07e3e876867ffb9e8781af47fa599b677fb27e051f6b5261c1d4f35';
const CVM_RELAYS = param('relays')
  ? param('relays').split(',').map(s=>s.trim()).filter(Boolean)
  : ['wss://relay.primal.net','wss://nos.lol','wss://nostr.mom'];
const USE_NOSTR = !param('api');
const API_BASE = (param('api') || `http://${location.hostname}:3000`).replace(/\/$/,'');
const POLL_MS = 5000, POLL_MIN = 5000, POLL_MAX = 30000;
const HIST_MAX = 5000;

// Providers — order matches the diagram
const PROVIDERS = ['friend','ollama','ppq','openrouter'];
const PROV_LABEL = {friend:'FRIEND',ollama:'OLLAMA',ppq:'PPQ',openrouter:'OPENROUTER'};
const PROV_COLOR = {friend:'#bc8cff',ollama:'#39d2c0',ppq:'#f0883e',openrouter:'#f85149'};
const PROV_ALIVE = {friend:true,ollama:true,ppq:false,openrouter:true};

// Models served by each provider with per-model base rates ($/M)
const PROV_MODELS = {
  friend: [
    {model:'glm-5.2', rate:0.009},
    {model:'glm-4.5-flash', rate:0.023},
    {model:'glm-4.6v', rate:0.035},
  ],
  ollama: [
    {model:'glm-5.2', rate:0.024},
    {model:'kimi-k2.7-code', rate:0.054},
    {model:'kimi-k3:cloud', rate:0.055},
  ],
  ppq: [
    {model:'deepseek/deepseek-v4-flash', rate:0.020},
  ],
  openrouter: [
    {model:'glm-5.2', rate:0.135},
  ],
};

// Distinct color per model
const MODEL_COLORS = {
  'glm-5.2': '#58a6ff',
  'glm-4.5-flash': '#39d2c0',
  'glm-4.5-air': '#7ee787',
  'glm-4.6v': '#d2a8ff',
  'kimi-k2.7-code': '#f0883e',
  'kimi-k3:cloud': '#bc8cff',
  'deepseek/deepseek-v4-flash': '#f85149',
};

// Pricing curve constants
const PRESSURE_K = 0.3;

/* ════════════════════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════════════════════ */
let state = {
  snapshot: null,
  priceHist: {},   // key -> [{t,cost_basis,your_price}]
  costToday: 0,
};
PROVIDERS.forEach(k => state.priceHist[k] = []);

/* ════════════════════════════════════════════════════════════════════════
   UTILITIES
   ════════════════════════════════════════════════════════════════════════ */
function fmt$(n,dp=4){if(n==null||isNaN(n))return'—';if(n>=1)return'$'+n.toFixed(2);return'$'+n.toFixed(dp);}
function fmtTok(n){if(n==null||isNaN(n))return'—';n=Number(n);if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(Math.round(n));}
function setConn(mode){
  const b=document.getElementById('conn-badge'),t=document.getElementById('conn-text');
  b.className='badge';
  if(mode==='live'){b.classList.add('live');t.textContent='LIVE · REAL DATA';}
  else if(mode==='connecting'){b.classList.add('connecting');t.textContent='connecting…';}
  else if(mode==='stale'){b.classList.add('stale');t.textContent='STALE';}
  else{b.classList.add('error');t.textContent='OFFLINE';}
}

/* ════════════════════════════════════════════════════════════════════════
   SNAPSHOT NORMALIZATION (reused from original)
   ════════════════════════════════════════════════════════════════════════ */
function normalizeSnapshot(raw){
  if(!raw||typeof raw!=='object')return null;
  return{
    ts:raw.ts||Date.now()/1000,
    pricing:raw.pricing||{},
    pricing_meta:raw.pricing_meta||null,
    quota:raw.quota||{},
    requests:raw.routing_decisions||raw.requests||[],
    provider_distribution:raw.provider_dist||raw.provider_distribution||{},
    cost_today:raw.cost_today??0,
    real_rates_tracker:raw.real_rates_tracker||null,
    real_rates:raw.real_rates||{},
  };
}

/* ════════════════════════════════════════════════════════════════════════
   ASYMPTOTIC PRICING CURVE
   price = baseRate × (1 + K × t / (1-t))   where t = quotaUsedFraction
   As t→1, price→∞ (asymptotic)
   ════════════════════════════════════════════════════════════════════════ */
function asymptoticPrice(baseRate, usedPct){
  const t = Math.max(0, Math.min(0.99, usedPct/100));
  return baseRate * (1 + PRESSURE_K * t / (1 - t + 0.001));
}

// Get base rate for a provider
function getBaseRate(snap, provider){
  const meta = snap.pricing_meta || {};
  if(provider==='friend') return meta.flat_key_cost_per_m || 0.02;
  if(provider==='ollama'){
    const tok30d = meta.ollama_tokens_30d || 1;
    return meta.ollama_monthly_usd / Math.max(1, tok30d/1e6);
  }
  if(provider==='ppq') return meta.ppq_cost_per_m_real || 0.14;
  if(provider==='openrouter') return 0.135;
  return 0.02;
}

// Get quota used percentage for a provider
function getQuotaUsed(snap, provider){
  const q = snap.quota[provider] || {};
  if(provider==='ollama') return Math.max(q.session_usage||0, q.weekly_usage||0) * 100;
  return q.used_pct || 0;
}

// Is this provider pay-per-use (no quota cap)?
function isPayPerUse(provider){return provider==='ppq'||provider==='openrouter';}

/* ════════════════════════════════════════════════════════════════════════
   RENDER: PROVIDER CARDS
   ════════════════════════════════════════════════════════════════════════ */
const PLOT_BG='#0d1117', PLOT_GRID='rgba(48,54,61,.3)';

function initProviderCards(){
  const row = document.getElementById('provider-row');
  row.innerHTML='';
  for(const p of PROVIDERS){
    const card = document.createElement('div');
    card.className='provider-card';
    card.id=`prov-${p}`;
    const alive = PROV_ALIVE[p];
    const dotClass = alive?'alive':'dead';
    card.innerHTML=`
      <div class="card-header">
        <span style="display:flex;align-items:center">
          <span class="status-dot ${dotClass}"></span>
          <span class="provider-name" style="color:${PROV_COLOR[p]}">${PROV_LABEL[p]}</span>
        </span>
        <span class="provider-rate" id="prov-rate-${p}">—</span>
      </div>
      <div class="provider-chart" id="prov-chart-${p}"></div>
      <div class="provider-status" id="prov-status-${p}"></div>
    `;
    row.appendChild(card);
  }
}

function renderProviders(snap){
  for(const p of PROVIDERS){
    const usedPct = getQuotaUsed(snap, p);
    const ppu = isPayPerUse(p);
    const models = PROV_MODELS[p] || [];
    
    // Find cheapest model for header display
    let cheapestRate = Infinity;
    for(const m of models){ if(m.rate < cheapestRate) cheapestRate = m.rate; }
    if(cheapestRate === Infinity) cheapestRate = getBaseRate(snap, p);
    
    // Update rate display — show cheapest model rate
    const rateEl = document.getElementById(`prov-rate-${p}`);
    if(rateEl) rateEl.textContent = `from ${fmt$(cheapestRate)}/M`;
    
    // Update status
    const statusEl = document.getElementById(`prov-status-${p}`);
    if(statusEl){
      if(ppu){
        statusEl.innerHTML = `<span>Pay-per-use</span><span>${usedPct>0?'credits used':'$5 balance'}</span>`;
      }else{
        const q = snap.quota[p] || {};
        statusEl.innerHTML = `<span>${usedPct.toFixed(1)}% used</span><span>${q.remaining?fmtTok(q.remaining)+' tok left':'—'}</span>`;
      }
    }
    
    // Build Plotly traces — one curve per model
    const chartDiv = `prov-chart-${p}`;
    const traces = [];
    
    for(const m of models){
      const baseRate = m.rate;
      const color = MODEL_COLORS[m.model] || '#8b949e';
      const xVals=[], yFull=[], yFill=[];
      const fillX=[];
      
      if(ppu){
        // Flat line — no quota cap
        for(let pct=0; pct<=100; pct+=2){
          xVals.push(pct);
          yFull.push(baseRate);
        }
        // Fill 0% to "usage" (nominal 10% to show some fill)
        for(let pct=0; pct<=10; pct+=2){
          fillX.push(pct);
          yFill.push(baseRate);
        }
      }else{
        // Asymptotic curve from 0% to 95%
        for(let pct=0; pct<=95; pct+=1){
          xVals.push(pct);
          yFull.push(asymptoticPrice(baseRate, pct));
        }
        // Fill area from 0 to current usage
        for(let pct=0; pct<=Math.min(usedPct,95); pct+=1){
          fillX.push(pct);
          yFill.push(asymptoticPrice(baseRate, pct));
        }
      }
      
      // Full curve (faded line)
      traces.push({
        x:xVals, y:yFull, mode:'lines',
        line:{color:color+'55',width:1.5},
        name:m.model, hoverinfo:'skip', showlegend:true,
        legendgroup:m.model,
      });
      
      // Filled area under curve (0 to current usage) — solid color, 25% opacity
      if(fillX.length>1){
        traces.push({
          x:fillX, y:yFill, mode:'none', fill:'tozeroy',
          fillcolor:color+'40', line:{width:0}, name:'', hoverinfo:'skip',
          showlegend:false, legendgroup:m.model,
        });
      }
      
      // Current position marker
      if(!ppu && usedPct>0){
        traces.push({
          x:[usedPct], y:[asymptoticPrice(baseRate, usedPct)], mode:'markers',
          marker:{size:8,color:color,line:{color:'#fff',width:1.5}},
          name:'', showlegend:false, legendgroup:m.model,
          hovertemplate:`<b>${m.model}</b><br>${usedPct.toFixed(1)}% used<br>${fmt$(asymptoticPrice(baseRate, usedPct))}/M<extra></extra>`,
        });
      }
    }
    
    const layout = {
      paper_bgcolor:PLOT_BG, plot_bgcolor:PLOT_BG,
      margin:{l:40,r:8,t:4,b:28},
      showlegend:true,
      legend:{orientation:'h',y:-0.25,font:{size:7,color:'#8b949e'},
        traceorder:'normal',x:0.5,xanchor:'center'},
      xaxis:{title:'Quota Used %',gridcolor:PLOT_GRID,zeroline:false,
        tickfont:{size:9,color:'#8b949e'},range:[0,100],tickvals:[0,25,50,75,100]},
      yaxis:{title:'Price/M',gridcolor:PLOT_GRID,zeroline:false,
        tickfont:{size:9,color:'#8b949e'},type:'log',
        tickformat:'$.3f',automargin:true},
      font:{family:'SF Mono,monospace',size:9,color:'#8b949e'},
    };
    
    Plotly.react(chartDiv, traces, layout, {displayModeBar:false,responsive:true});
  }
}

/* ════════════════════════════════════════════════════════════════════════
   RENDER: CONSUMER CHART (Price/M over time per provider)
   ════════════════════════════════════════════════════════════════════════ */
function renderConsumer(snap){
  const traces=[];
  
  // Collect all unique models across all providers
  const seenModels = new Set();
  for(const p of PROVIDERS){
    for(const m of (PROV_MODELS[p]||[])){
      seenModels.add(m.model);
    }
  }
  
  // Determine which model is currently active from routing decisions
  const reqs = snap.requests || [];
  let activeModel = null;
  if(reqs.length){
    const last = reqs[0];
    activeModel = last.model || last.model_name || null;
  }
  
  // Build per-model price history from provider histories
  // Each provider's price history applies to all models that provider serves
  for(const modelName of seenModels){
    const color = MODEL_COLORS[modelName] || '#8b949e';
    const histPoints = [];
    
    for(const p of PROVIDERS){
      const models = PROV_MODELS[p] || [];
      if(!models.find(m=>m.model===modelName)) continue;
      const hist = state.priceHist[p] || [];
      for(const pt of hist){
        histPoints.push({t:pt.t, price:pt.your_price||pt.cost_basis});
      }
    }
    
    if(!histPoints.length) continue;
    histPoints.sort((a,b)=>a.t-b.t);
    
    // Historical line
    traces.push({
      x: histPoints.map(pt=>pt.t*1000), y: histPoints.map(pt=>pt.price),
      mode:'lines', line:{color:color,width:1.5}, name:modelName,
      hovertemplate:`<b>${modelName}</b><br>%{y:$.4f}/M<br>%{x}<extra></extra>`,
    });
    
    // Current price point — use the cheapest provider's current price for this model
    let cheapestCurrent = Infinity;
    for(const p of PROVIDERS){
      const models = PROV_MODELS[p] || [];
      const m = models.find(mm=>mm.model===modelName);
      if(!m) continue;
      const usedPct = getQuotaUsed(snap, p);
      const currentPrice = isPayPerUse(p) ? m.rate : asymptoticPrice(m.rate, usedPct);
      if(currentPrice < cheapestCurrent) cheapestCurrent = currentPrice;
    }
    if(cheapestCurrent < Infinity){
      traces.push({
        x:[Date.now()], y:[cheapestCurrent], mode:'markers',
        marker:{size:8,color:color,symbol:'circle',line:{color:'#fff',width:1}},
        name:modelName+' now', showlegend:false,
        hovertemplate:`<b>${modelName} NOW</b><br>${fmt$(cheapestCurrent)}/M<extra></extra>`,
      });
    }
  }
  
  const layout={
    paper_bgcolor:PLOT_BG, plot_bgcolor:PLOT_BG,
    margin:{l:50,r:20,t:10,b:35},
    showlegend:true,
    legend:{orientation:'h',y:-0.15,font:{size:10,color:'#8b949e'},
      traceorder:'normal',x:0.5,xanchor:'center'},
    xaxis:{title:'',gridcolor:PLOT_GRID,zeroline:false,
      tickfont:{size:9,color:'#8b949e'},type:'date',tickformat:'%m/%d'},
    yaxis:{title:'Price / M ($)',gridcolor:PLOT_GRID,zeroline:false,
      tickfont:{size:9,color:'#8b949e'},type:'log',
      tickformat:'$.4f',automargin:true},
    font:{family:'SF Mono,monospace',size:10,color:'#8b949e'},
  };
  
  Plotly.react('consumer-chart', traces, layout, {displayModeBar:false,responsive:true});
  
  // Update consumer rate display
  const meta = snap.pricing_meta||{};
  const avgRate = getBaseRate(snap,'friend') * (1+(meta.margin||0.266));
  document.getElementById('consumer-rate').textContent = `Avg: ${fmt$(avgRate)}/M · Spend today: ${fmt$(snap.cost_today||0,2)}`;
}

/* ════════════════════════════════════════════════════════════════════════
   RENDER: EDGES (SVG lines from providers to consumer)
   ════════════════════════════════════════════════════════════════════════ */
function renderEdges(snap){
  const svg = document.getElementById('edges-svg');
  const container = document.getElementById('arch-container');
  const consumerEl = document.querySelector('.consumer-card');
  const containerRect = container.getBoundingClientRect();
  
  svg.setAttribute('viewBox',`0 0 ${containerRect.width} ${containerRect.height}`);
  svg.setAttribute('width',containerRect.width);
  svg.setAttribute('height',containerRect.height);
  
  // Get consumer card top-center position
  const consumerRect = consumerEl.getBoundingClientRect();
  const consumerTop = consumerRect.top - containerRect.top + 5; // top of consumer card
  const consumerCenterX = consumerRect.left - containerRect.left + consumerRect.width/2;
  
  // Determine active provider and model from recent routing decisions
  const reqs = snap.requests || [];
  let activeProvider = null, activeModel = null;
  if(reqs.length){
    const last = reqs[0];
    const key = last.key || last.provider || '';
    const keyMap = {'friend':'friend','ollama_cloud':'ollama','ollama':'ollama','ppq':'ppq','openrouter':'openrouter'};
    activeProvider = keyMap[key] || keyMap[last.provider] || null;
    activeModel = last.model || last.model_name || null;
  }
  
  // Also check provider distribution
  const dist = snap.provider_distribution || {};
  let maxDist = 0, distProvider = null;
  for(const p of PROVIDERS){
    const d = dist[p] || 0;
    if(d > maxDist){maxDist=d; distProvider=p;}
  }
  
  // Draw edges
  let svgContent='';
  for(const p of PROVIDERS){
    const card = document.getElementById(`prov-${p}`);
    if(!card) continue;
    const cardRect = card.getBoundingClientRect();
    const cardBottom = cardRect.bottom - containerRect.top;
    const cardCenterX = cardRect.left - containerRect.left + cardRect.width/2;
    
    const isActive = (p===activeProvider) || (!activeProvider && p===distProvider);
    
    // Determine edge color: use active model's color if this is the active provider,
    // otherwise use the cheapest model's color for that provider
    let edgeColor = PROV_COLOR[p]; // fallback to provider color
    if(isActive && activeModel && MODEL_COLORS[activeModel]){
      edgeColor = MODEL_COLORS[activeModel];
    } else {
      // Use cheapest model's color for this provider
      const models = PROV_MODELS[p] || [];
      if(models.length){
        let cheapest = models[0];
        for(const m of models){ if(m.rate < cheapest.rate) cheapest = m; }
        edgeColor = MODEL_COLORS[cheapest.model] || PROV_COLOR[p];
      }
    }
    
    const width = isActive?3:1.5;
    const opacity = isActive?0.9:0.4;
    
    // Curved bezier from provider bottom to consumer top
    const midY = (cardBottom + consumerTop)/2;
    const path = `M ${cardCenterX} ${cardBottom} C ${cardCenterX} ${midY}, ${consumerCenterX} ${midY}, ${consumerCenterX} ${consumerTop}`;
    
    svgContent += `<path class="edge-line ${isActive?'active':''}" d="${path}" stroke="${color}" stroke-width="${width}" opacity="${opacity}" fill="none"/>`;
    
    // Flow dot on active edges
    if(isActive){
      const dotId = `dot-${p}`;
      svgContent += `<circle r="4" fill="${color}" opacity="0.9">
        <animateMotion dur="2s" repeatCount="indefinite">
          <mpath href="#${dotId}-path"/>
        </animateMotion>
      </circle>
      <path id="${dotId}-path" d="${path}" fill="none" stroke="none"/>`;
    }
  }
  
  svg.innerHTML = svgContent;
}

/* ════════════════════════════════════════════════════════════════════════
   RENDER ALL
   ════════════════════════════════════════════════════════════════════════ */
function renderAll(){
  const snap = state.snapshot;
  if(!snap) return;
  renderProviders(snap);
  renderConsumer(snap);
  renderEdges(snap);
}

/* ════════════════════════════════════════════════════════════════════════
   SNAPSHOT FETCH — Nostr + HTTP fallback (reused)
   ════════════════════════════════════════════════════════════════════════ */
let nostrPool=null, nostrSub=null;
let pollInterval=POLL_MS, lastNostrEventAt=0;
let nostrWatchdog=null, nostrReconnectTimer=null;
let priceHistSeeded=false;

const STALE_THRESHOLD_MS = parseInt(param('stale_ms'))||15000;
const NOSTR_RECONNECT_MS = parseInt(param('reconnect_ms'))||60000;

function seedPriceHistory(points){
  if(!Array.isArray(points)||!points.length||priceHistSeeded) return;
  const byKey={};
  for(const pt of points){
    const k=pt.key;
    // Map 'ollama_cloud' -> 'ollama'
    const mk = k==='ollama_cloud'?'ollama':k;
    if(!PROVIDERS.includes(mk)) continue;
    if(!byKey[mk]) byKey[mk]=[];
    byKey[mk].push({t:pt.t??pt.ts, cost_basis:pt.cost_basis, your_price:pt.your_price, margin_pct:pt.margin_pct});
  }
  for(const k of PROVIDERS){
    const seeded=byKey[k];
    if(seeded&&seeded.length){
      seeded.sort((a,b)=>a.t-b.t);
      state.priceHist[k]=seeded.slice(-HIST_MAX);
    }
  }
  priceHistSeeded=true;
}

async function initNostr(){
  if(nostrSub){try{nostrSub.close();}catch(e){}nostrSub=null;}
  const N=window.NostrTools;
  const PoolCtor=window.__testNostrPool||(N&&N.SimplePool);
  if(!PoolCtor) throw new Error('nostr-tools not loaded');
  if(!nostrPool) nostrPool=new PoolCtor();
  nostrSub=nostrPool.subscribeMany(CVM_RELAYS,{
    kinds:[30315], authors:[CVM_NPUB_HEX], "#d":["cvm-snapshot"], limit:1,
  },{
    onevent:(event)=>{
      lastNostrEventAt=Date.now();
      try{
        const raw=JSON.parse(event.content);
        const snap=normalizeSnapshot(raw);
        if(!snap) throw new Error('invalid snapshot');
        if(raw.price_history) seedPriceHistory(raw.price_history);
        state.snapshot=snap;
        if(raw.cost_today!=null) state.costToday=raw.cost_today;
        setConn('live');
        renderAll();
      }catch(e){console.warn('Parse error:',e.message);}
    },
    oneose:()=>{console.log('Nostr EOSE');},
  });
  startNostrWatchdog();
}

function startNostrWatchdog(){
  if(nostrWatchdog) return;
  nostrWatchdog=setInterval(()=>{
    if(!state.snapshot||!lastNostrEventAt) return;
    if(Date.now()-lastNostrEventAt>STALE_THRESHOLD_MS) setConn('stale');
  },Math.min(5000,STALE_THRESHOLD_MS));
  nostrReconnectTimer=setInterval(()=>{
    const since=lastNostrEventAt?Date.now()-lastNostrEventAt:Infinity;
    if(since>NOSTR_RECONNECT_MS){
      console.warn('[nostr] reconnecting…');
      lastNostrEventAt=0;
      initNostr().catch(e=>console.warn('[nostr] reconnect failed:',e.message));
    }
  },Math.min(10000,NOSTR_RECONNECT_MS));
}

async function pollHttp(){
  let ok=false;
  try{
    setConn('connecting');
    const resp=await fetch(`${API_BASE}/snapshot`,{signal:AbortSignal.timeout(8000)});
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const raw=await resp.json();
    const snap=normalizeSnapshot(raw);
    if(!snap) throw new Error('invalid snapshot');
    if(raw.price_history) seedPriceHistory(raw.price_history);
    state.snapshot=snap;
    if(snap.cost_today!=null) state.costToday=snap.cost_today;
    setConn('live');
    ok=true;
  }catch(e){
    console.warn('HTTP fetch failed:',e.message);
    if(state.snapshot) setConn('stale'); else setConn('offline');
  }
  renderAll();
  let nextDelay=ok?POLL_MIN:pollInterval;
  if(!ok) pollInterval=Math.min(pollInterval*2,POLL_MAX);
  setTimeout(pollHttp,nextDelay);
}

/* ════════════════════════════════════════════════════════════════════════
   CLOCK + INIT
   ════════════════════════════════════════════════════════════════════════ */
function tickClock(){document.getElementById('time-text').textContent=new Date().toLocaleTimeString('en-GB',{hour12:false});}

async function init(){
  initProviderCards();
  tickClock(); setInterval(tickClock,1000);
  setConn('connecting');
  
  // HTTP path: also fetch price history
  if(!USE_NOSTR){
    try{
      const phResp=await fetch(`${API_BASE}/price-history?hours=168`);
      if(phResp.ok){
        const ph=await phResp.json();
        if(ph&&ph.points) seedPriceHistory(ph.points);
      }
    }catch(e){console.warn('Price history fetch failed:',e.message);}
  }
  
  if(USE_NOSTR){
    setConn('connecting');
    try{await initNostr();}catch(e){console.warn('Nostr init failed:',e.message);setConn('offline');}
  }else{
    await pollHttp();
  }
  
  // Redraw edges on window resize
  window.addEventListener('resize',()=>{
    if(state.snapshot) renderEdges(state.snapshot);
  });
}
init();
</script>
