<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sovereign Routing Engine</title>
<script src="vendor/plotly-2.35.2.min.js"></script>
<script src="vendor/nostr-tools.min.js"></script>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d; --border2:#1f2937;
  --txt:#c9d1d9; --txt-dim:#8b949e; --txt-bright:#e6edf3;
  --blue:#58a6ff; --green:#3fb950; --cyan:#39d2c0; --purple:#bc8cff;
  --orange:#f0883e; --red:#f85149; --yellow:#d29922; --pink:#f778ba;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.topbar{padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.topbar h1{font-size:15px;color:var(--txt-bright)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;border:1px solid var(--border)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.badge.live{border-color:var(--green);color:var(--green)}
.badge.connecting{border-color:var(--yellow);color:var(--yellow)}
.badge.connecting .dot{background:var(--yellow);animation:pulse 1.5s infinite}
.badge.error{border-color:var(--red);color:var(--red)}
.badge.error .dot{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Layout */
.dashboard{padding:16px;max-width:1400px;margin:0 auto}
.providers-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.edges-layer{height:50px;position:relative}
.consumer-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px}

/* Provider box */
.provider-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:260px;position:relative;overflow:hidden}
.provider-card.exhausted{border-color:var(--red)}
.provider-card.offline{opacity:.5}
.provider-card .pc-header{display:flex;justify-content:space-between;align-items:center}
.provider-card .pc-name{font-size:11px;font-weight:700;color:var(--txt-bright);letter-spacing:.5px}
.provider-card .pc-status{font-size:9px;padding:2px 6px;border-radius:10px;background:var(--bg3);color:var(--txt-dim)}
.provider-card .pc-status.healthy{color:var(--green)}
.provider-card .pc-status.exhausted{color:var(--red)}
.provider-card .pc-status.offline{color:var(--txt-dim)}
.provider-card .pc-chart{flex:1;min-height:140px}
.provider-card .pc-footer{font-size:9px;color:var(--txt-dim);display:flex;justify-content:space-between}
.provider-card .pc-footer .usage-pct{font-family:monospace;font-weight:700}

/* Consumer chart */
.consumer-box h2{font-size:13px;color:var(--txt-bright);margin-bottom:8px}
.consumer-chart{width:100%;height:220px}
.consumer-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--txt-dim)}
.legend-dot{width:10px;height:10px;border-radius:2px}

/* SVG edges */
.edge-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.edge-line{stroke:var(--border);stroke-width:2;fill:none;transition:stroke .5s,stroke-width .5s}
.edge-line.active{stroke-width:3;filter:drop-shadow(0 0 4px currentColor)}
.flow-dot{fill:var(--border);transition:fill .5s}
.flow-dot.active{animation:flowDown 1.5s linear infinite}
@keyframes flowDown{0%{offset-distance:0%;opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}

/* Responsive */
@media(max-width:1100px){.providers-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.providers-row{grid-template-columns:repeat(2,1fr)}.consumer-chart{height:160px}}
@media(max-width:480px){.providers-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <h1>Sovereign Routing Engine</h1>
  <div class="badge connecting" id="conn-badge"><span class="dot"></span><span id="conn-text">connecting…</span></div>
</div>

<div class="dashboard">
  <!-- Provider row -->
  <div class="providers-row" id="providers-row">
    <!-- Generated by JS -->
  </div>

  <!-- SVG edges between providers and consumer -->
  <div class="edges-layer" id="edges-layer">
    <svg class="edge-svg" id="edge-svg"></svg>
  </div>

  <!-- Consumer box -->
  <div class="consumer-box">
    <h2>Consumer — Price/M over Time per Model</h2>
    <div class="consumer-chart" id="consumer-chart"></div>
    <div class="consumer-legend" id="consumer-legend"></div>
  </div>
</div>

<script>
// ═══ CONSTANTS ═══
const PLOT_BG='transparent', PLOT_GRID='rgba(48,54,61,.4)';
const ONSET=0.80, ASYMPTOTE=1.5;

const MODEL_COLORS={
  'glm-5.2':'#58a6ff',
  'glm-4.5-flash':'#39d2c0',
  'glm-4.5-air':'#7ee787',
  'glm-4.6v':'#d2a8ff',
  'kimi-k2.7-code':'#f0883e',
  'kimi-k3:cloud':'#bc8cff',
  'deepseek/deepseek-v4-flash':'#f85149',
};
const MODEL_LABELS={
  'glm-5.2':'GLM-5.2',
  'glm-4.5-flash':'GLM-4.5-Flash',
  'glm-4.5-air':'GLM-4.5-Air',
  'glm-4.6v':'GLM-4.6V',
  'kimi-k2.7-code':'Kimi-K2.7',
  'kimi-k3:cloud':'Kimi-K3',
  'deepseek/deepseek-v4-flash':'DeepSeek-V4',
};
const MODEL_RATES={
  'glm-5.2':0.022,
  'glm-4.5-flash':0.018,
  'glm-4.5-air':0.012,
  'glm-4.6v':0.035,
  'kimi-k2.7-code':0.024,
  'kimi-k3:cloud':0.055,
  'deepseek/deepseek-v4-flash':0.020,
};

const PROVIDERS=[
  {id:'ours',name:'OURS',models:['glm-5.2','glm-4.5-flash'],quotaKey:'ours'},
  {id:'friend',name:'FRIEND',models:['glm-5.2','glm-4.5-flash','glm-4.6v'],quotaKey:'friend'},
  {id:'ollama',name:'OLLAMA',models:['glm-5.2','kimi-k2.7-code','kimi-k3:cloud'],quotaKey:'ollama'},
  {id:'ppq',name:'PPQ',models:['deepseek/deepseek-v4-flash'],quotaKey:'ppq'},
  {id:'openrouter',name:'OPENROUTER',models:['glm-5.2'],quotaKey:'openrouter'},
];

// ═══ PRICING MATH ═══
function pressureFactor(u){
  if(u<=ONSET)return 1.0;
  if(u>=0.995)return ASYMPTOTE*5;
  const t=(u-ONSET)/(1-ONSET);
  const K=ASYMPTOTE-1;
  return 1+K*t/(1-t);
}

function genCurve(baseRate,npts){
  const x=[],y=[];
  for(let i=0;i<=npts;i++){
    const q=i/npts;
    x.push(q*100);
    y.push(baseRate*pressureFactor(q));
  }
  return{x,y};
}

function genFilled(baseRate,currentUsage){
  const x=[],y=[];
  const npts=Math.max(2,Math.ceil(currentUsage*50));
  for(let i=0;i<=npts;i++){
    const q=i/50;
    x.push(q*100);
    y.push(baseRate*pressureFactor(q));
  }
  return{x,y};
}

// ═══ DATA FETCHING ═══
const RELAYS=['wss://relay.primal.net','wss://nos.lol','wss://nostr.mom'];
let pool=null, lastSnap=null;

function setConn(mode){
  const b=document.getElementById('conn-badge'),t=document.getElementById('conn-text');
  b.className='badge';
  if(mode==='live'){b.classList.add('live');t.textContent='LIVE · REAL DATA';}
  else if(mode==='connecting'){b.classList.add('connecting');t.textContent='connecting…';}
  else if(mode==='stale'){b.classList.add('connecting');t.textContent='STALE';}
  else{b.classList.add('error');t.textContent='OFFLINE';}
}

async function tryLocalAPI(){
  try{
    const r=await fetch('http://localhost:3000/snapshot',{signal:AbortSignal.timeout(3000)});
    if(r.ok)return await r.json();
  }catch{}
  return null;
}

function connectNostr(){
  if(typeof NostrTools==='undefined'||!NostrTools.SimplePool){return;}
  try{pool?.close?.()}catch{}
  pool=new NostrTools.SimplePool();
  const sub=pool.sub(RELAYS,[{kinds:[25910],limit:1}]);
  sub.on('event',(ev)=>{
    try{
      const data=JSON.parse(ev.content);
      lastSnap=data;
      setConn('live');
      renderAll(data);
    }catch{}
  });
}

// ═══ RENDER: PROVIDER CARDS ═══
function initProviderCards(){
  const row=document.getElementById('providers-row');
  row.innerHTML=PROVIDERS.map(p=>`
    <div class="provider-card" id="card-${p.id}">
      <div class="pc-header">
        <span class="pc-name">${p.name}</span>
        <span class="pc-status" id="status-${p.id}">—</span>
      </div>
      <div class="pc-chart" id="chart-${p.id}"></div>
      <div class="pc-footer">
        <span>Quota: <span class="usage-pct" id="usage-${p.id}">—</span></span>
        <span id="rate-${p.id}">—</span>
      </div>
    </div>
  `).join('');
}

function getUsageFraction(snap,provId){
  const q=snap?.quota||{};
  const prov=PROVIDERS.find(p=>p.id===provId);
  const qd=q[prov?.quotaKey||provId];
  if(!qd)return 0;
  // ppq has no quota cap
  if(provId==='ppq'){
    if(qd.note&&qd.note.includes('pay-per-use'))return 0;
    if(qd.used_pct!==undefined&&qd.used_pct>0)return Math.min(1,qd.used_pct/100);
    return 0;
  }
  if(qd.used_pct!==undefined)return Math.min(1,qd.used_pct/100);
  if(qd.weekly_pct!==undefined)return Math.min(1,qd.weekly_pct/100);
  if(qd.usage_fraction!==undefined)return Math.min(1,qd.usage_fraction);
  return 0;
}

function getProviderStatus(snap,provId){
  const q=snap?.quota||{};
  const prov=PROVIDERS.find(p=>p.id===provId);
  const qd=q[prov?.quotaKey||provId];
  if(!qd)return{text:'NO DATA',cls:''};
  if(qd.healthy===false)return{text:'OFFLINE',cls:'offline'};
  if(provId==='ppq'){
    const u=getUsageFraction(snap,provId);
    if(u>=0.99)return{text:'EXHAUSTED',cls:'exhausted'};
    return{text:'PAY/USE',cls:'healthy'};
  }
  const u=getUsageFraction(snap,provId);
  if(u>=0.99)return{text:'LOCKED',cls:'exhausted'};
  if(u>=0.80)return{text:'HIGH',cls:'exhausted'};
  return{text:'HEALTHY',cls:'healthy'};
}

function renderProviderChart(provId,models,usageFrac){
  const elId='chart-'+provId;
  const el=document.getElementById(elId);
  if(!el)return;
  const traces=[];

  models.forEach(model=>{
    const baseRate=MODEL_RATES[model]||0.02;
    const color=MODEL_COLORS[model]||'#d2a8ff';
    const label=MODEL_LABELS[model]||model;

    // Full curve (light)
    const full=genCurve(baseRate,50);
    traces.push({
      x:full.x,y:full.y,
      mode:'lines',
      line:{color:color,width:1.5,opacity:0.4},
      name:label,showlegend:false,
      hovertemplate:`${label}<br>%{y:.4f}/M at %{x:.0f}% quota<extra></extra>`,
    });

    // Filled area up to current usage
    const filled=genFilled(baseRate,usageFrac);
    traces.push({
      x:filled.x,y:filled.y,
      fill:'tozeroy',fillcolor:color+'25',
      line:{color:color,width:2},
      name:label+'_fill',showlegend:false,hoverinfo:'skip',
    });

    // Current position marker
    const currentY=baseRate*pressureFactor(usageFrac);
    traces.push({
      x:[usageFrac*100],y:[currentY],
      mode:'markers',
      marker:{color:color,size:7,line:{color:'#fff',width:1}},
      name:label+'_pos',showlegend:false,hoverinfo:'skip',
    });
  });

  const layout={
    margin:{l:38,r:8,t:5,b:28},
    xaxis:{
      title:{text:'Quota %',font:{size:8,color:'#8b949e'}},
      range:[0,100],gridcolor:PLOT_GRID,tickfont:{size:8,color:'#8b949e'},
      tickvals:[0,50,100],tickformat:'d',
    },
    yaxis:{
      title:{text:'$/M',font:{size:8,color:'#8b949e'}},
      type:'log',gridcolor:PLOT_GRID,tickfont:{size:8,color:'#8b949e'},
      tickformat:'.3f',
    },
    paper_bgcolor:PLOT_BG,plot_bgcolor:PLOT_BG,
    font:{size:8,color:'#8b949e'},
    showlegend:false,
  };

  Plotly.react(elId,traces,layout,{displayModeBar:false,responsive:true});
}

// ═══ RENDER: CONSUMER CHART ═══
function renderConsumerChart(snap){
  const el=document.getElementById('consumer-chart');
  if(!el)return;
  const priceHistory=snap?.price_history||[];
  
  if(!priceHistory.length){
    // Seed with synthetic data for display
    seedSyntheticConsumerChart();
    return;
  }

  // Group by key (provider) → map to model
  const keyToModel={
    'ours':'glm-5.2',
    'friend':'glm-5.2',
    'ollama':'kimi-k2.7-code',
    'ppq':'deepseek/deepseek-v4-flash',
    'openrouter':'glm-5.2',
  };

  const byModel={};
  priceHistory.forEach(pt=>{
    const model=keyToModel[pt.key]||pt.key;
    if(!byModel[model])byModel[model]=[];
    byModel[model].push({
      x:new Date(pt.ts*1000),
      y:pt.your_price||pt.cost_basis||0,
    });
  });

  const traces=[];
  const legendItems=[];
  Object.keys(byModel).sort().forEach(model=>{
    const pts=byModel[model].sort((a,b)=>a.x-b.x);
    const color=MODEL_COLORS[model]||'#d2a8ff';
    traces.push({
      x:pts.map(p=>p.x),
      y:pts.map(p=>p.y),
      mode:'lines',
      line:{color:color,width:2},
      name:MODEL_LABELS[model]||model,
    });
    legendItems.push({model,color,label:MODEL_LABELS[model]||model});
  });

  const layout={
    margin:{l:50,r:15,t:5,b:35},
    xaxis:{
      title:{text:'Time',font:{size:10,color:'#8b949e'}},
      gridcolor:PLOT_GRID,tickfont:{size:9,color:'#8b949e'},
    },
    yaxis:{
      title:{text:'Price/M ($)',font:{size:10,color:'#8b949e'}},
      type:'log',gridcolor:PLOT_GRID,tickfont:{size:9,color:'#8b949e'},
      tickformat:'.3f',
    },
    paper_bgcolor:PLOT_BG,plot_bgcolor:PLOT_BG,
    font:{size:9,color:'#8b949e'},
    showlegend:true,
    legend:{orientation:'h',y:-0.2,font:{size:9}},
  };

  Plotly.react('consumer-chart',traces,layout,{displayModeBar:false,responsive:true});

  // Build legend dots
  const legendEl=document.getElementById('consumer-legend');
  legendEl.innerHTML=legendItems.map(li=>
    `<div class="legend-item"><div class="legend-dot" style="background:${li.color}"></div>${li.label}</div>`
  ).join('');
}

function seedSyntheticConsumerChart(){
  // Generate 24h of synthetic data for display when no live data
  const now=Date.now();
  const models=['glm-5.2','glm-4.5-flash','kimi-k2.7-code','kimi-k3:cloud'];
  const traces=[];
  models.forEach(model=>{
    const baseRate=MODEL_RATES[model]||0.02;
    const color=MODEL_COLORS[model]||'#d2a8ff';
    const x=[],y=[];
    for(let h=0;h<48;h++){
      x.push(new Date(now-(47-h)*1800*1000));
      const noise=(Math.random()-0.5)*0.3;
      const drift=1+Math.sin(h/8)*0.1+noise*0.05;
      y.push(baseRate*drift);
    }
    traces.push({x,y,mode:'lines',line:{color:color,width:2},name:MODEL_LABELS[model]||model});
  });
  const layout={
    margin:{l:50,r:15,t:5,b:35},
    xaxis:{title:{text:'Time',font:{size:10,color:'#8b949e'}},gridcolor:PLOT_GRID,tickfont:{size:9,color:'#8b949e'}},
    yaxis:{title:{text:'Price/M ($)',font:{size:10,color:'#8b949e'}},type:'log',gridcolor:PLOT_GRID,tickfont:{size:9,color:'#8b949e'},tickformat:'.3f'},
    paper_bgcolor:PLOT_BG,plot_bgcolor:PLOT_BG,font:{size:9,color:'#8b949e'},
    showlegend:true,legend:{orientation:'h',y:-0.2,font:{size:9}},
  };
  Plotly.react('consumer-chart',traces,layout,{displayModeBar:false,responsive:true});
  const models_list=['glm-5.2','glm-4.5-flash','kimi-k2.7-code','kimi-k3:cloud'];
  document.getElementById('consumer-legend').innerHTML=models_list.map(m=>
    `<div class="legend-item"><div class="legend-dot" style="background:${MODEL_COLORS[m]}"></div>${MODEL_LABELS[m]||m}</div>`
  ).join('');
}

// ═══ RENDER: EDGES ═══
function renderEdges(snap){
  const svg=document.getElementById('edge-svg');
  const container=document.getElementById('edges-layer');
  const providersRow=document.getElementById('providers-row');
  if(!svg||!container||!providersRow)return;

  const w=container.offsetWidth;
  const h=container.offsetHeight;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  svg.innerHTML='';

  // Get provider card positions
  const rowRect=providersRow.getBoundingClientRect();
  const consumerRect=document.querySelector('.consumer-box').getBoundingClientRect();
  const containerRect=container.getBoundingClientRect();

  PROVIDERS.forEach((p,i)=>{
    const card=document.getElementById('card-'+p.id);
    if(!card)return;
    const cardRect=card.getBoundingClientRect();
    const x1=cardRect.left+cardRect.width/2-containerRect.left;
    const y1=0; // top of edges layer (cards are above)
    const x2=w/2; // center of consumer
    const y2=h;  // bottom of edges layer (consumer is below)

    // Determine if provider is active
    const reqs=snap?.requests||snap?.routing_decisions||[];
    const isActive=reqs.some(r=>{
      const prov=r.provider||r.key_name||r.key||'';
      return prov===p.id||prov===p.quotaKey;
    });
    
    // Check provider health
    const status=getProviderStatus(snap,p.id);
    const isExhausted=status.cls==='exhausted';
    const isOffline=status.cls==='offline';
    
    // Determine color
    let strokeColor='var(--border)';
    let strokeWidth=2;
    let opacity=0.4;
    
    if(isOffline){opacity=0.15;}
    else if(isExhausted){strokeColor='var(--red)';opacity=0.5;}
    else if(isActive){
      // Find which model this provider is routing
      const activeReq=reqs.find(r=>{
        const prov=r.provider||r.key_name||r.key||'';
        return prov===p.id||prov===p.quotaKey;
      });
      const model=activeReq?.model||p.models[0];
      strokeColor=MODEL_COLORS[model]||'var(--green)';
      strokeWidth=3;
      opacity=1;
    }else{
      strokeColor='var(--green)';
      opacity=0.3;
    }

    // Draw curved edge
    const midY=h*0.5;
    const path=`M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
    
    const pathEl=document.createElementNS('http://www.w3.org/2000/svg','path');
    pathEl.setAttribute('d',path);
    pathEl.setAttribute('class','edge-line'+(isActive?' active':''));
    pathEl.setAttribute('stroke',strokeColor);
    pathEl.setAttribute('stroke-width',strokeWidth);
    pathEl.setAttribute('opacity',opacity);
    pathEl.setAttribute('fill','none');
    svg.appendChild(pathEl);

    // Flow dot for active edges
    if(isActive&&!isOffline){
      const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('r',4);
      dot.setAttribute('fill',strokeColor);
      dot.setAttribute('class','flow-dot active');
      dot.style.offsetPath=`path('${path}')`;
      svg.appendChild(dot);
    }
  });
}

// ═══ MAIN RENDER ═══
function renderAll(snap){
  if(!snap)return;

  // Render provider cards
  PROVIDERS.forEach(p=>{
    const usageFrac=getUsageFraction(snap,p.id);
    const status=getProviderStatus(snap,p.id);
    
    const statusEl=document.getElementById('status-'+p.id);
    if(statusEl){statusEl.textContent=status.text;statusEl.className='pc-status '+status.cls;}
    
    const usageEl=document.getElementById('usage-'+p.id);
    if(usageEl)usageEl.textContent=(usageFrac*100).toFixed(1)+'%';
    
    // Show cheapest model rate
    const cheapestRate=Math.min(...p.models.map(m=>MODEL_RATES[m]||0.02));
    const rateEl=document.getElementById('rate-'+p.id);
    if(rateEl)rateEl.textContent='$'+cheapestRate.toFixed(3)+'/M';
    
    const card=document.getElementById('card-'+p.id);
    if(card){
      card.classList.toggle('exhausted',status.cls==='exhausted');
      card.classList.toggle('offline',status.cls==='offline');
    }

    renderProviderChart(p.id,p.models,usageFrac);
  });

  // Render consumer chart
  renderConsumerChart(snap);

  // Render edges (after DOM settles)
  setTimeout(()=>renderEdges(snap),100);
}

// ═══ INIT ═══
async function init(){
  initProviderCards();
  setConn('connecting');

  // Try local API first
  const local=await tryLocalAPI();
  if(local){
    lastSnap=local;
    setConn('live');
    renderAll(local);
  }

  // Connect Nostr for live updates
  connectNostr();

  // Re-render edges on resize
  window.addEventListener('resize',()=>{
    if(lastSnap)setTimeout(()=>renderEdges(lastSnap),100);
  });

  // Poll local API every 5s as backup
  setInterval(async()=>{
    const snap=await tryLocalAPI();
    if(snap){
      lastSnap=snap;
      setConn('live');
      renderAll(snap);
    }
  },5000);
}

init();
</script>
</body>
</html>
